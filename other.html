<style>
@font-face {
font-family: "Fun";
src: url("fonts/LuckiestGuy.ttf") format("truetype");
}
@keyframes slideleft {
0% { 
opacity: 0;
transform: translateX(-100%); }
80%{
transform: translateX(5%);}
100% { 
opacity: 1;
transform: translateX(0%); }
}
@keyframes slideright {
0% { 
opacity: 0;
transform: translateX(100%); }
80%{
transform: translateX(-5%);}
100% { 
opacity: 1;
transform: translateX(0%); }
}
@keyframes pop {
0% { 
opacity: 0;
transform: scale(0.3)}
100% { 
opacity: 1;
transform: scale(1)}
}
@keyframes sizeup {
0% {transform: scale(1);}
50% {
transform: scale(1.1);}
100% {
box-shadow: 0 0 0 0 #0cedb1;
transform: scale(1);}
}
@keyframes inleft {
0% { 
opacity: 0;
transform: translateX(-100%); }
100%{
opacity: 1;
transform: translateX(0%); }
}
@keyframes inright {
0% { 
opacity: 0;
transform: translateX(100%); }
100%{
opacity: 1;
transform: translateX(0%); }
}
body {
height: 100%;
background-image: linear-gradient(to top, #fc8c03, #2b0182, #23016b);
background-repeat: no-repeat;
background-attachment: fixed;
cursor: url("images/cursor_auto.png"), auto; 
}
@media (max-width: 400px) {
body { zoom: 0.4; }
}

width: 150px;

background-color: #00cc55;
